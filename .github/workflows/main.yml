name: Windows RDP TEMP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Enable RDP
      shell: pwsh
      run: |
        Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Restart-Service TermService -Force

    - name: Create RDP User
      shell: pwsh
      run: |
        $user = "rdp"
        $pass = "P@ssw0rd123!"

        net user $user $pass /add
        net localgroup administrators $user /add
        net localgroup "Remote Desktop Users" $user /add

        Write-Host "RDP USER CREATED"
        Write-Host "USERNAME: $user"
        Write-Host "PASSWORD: $pass"

    - name: Download & Install Tailscale
      shell: pwsh
      run: |
        $msi = "$env:TEMP\tailscale.msi"
        Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile $msi
        Start-Process msiexec.exe -ArgumentList "/i `"$msi`" /quiet /norestart" -Wait

    - name: Start Tailscale and FORCE SHOW IP
      shell: pwsh
      env:
        TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
      run: |
        $ts = "C:\Program Files\Tailscale\tailscale.exe"

        & $ts up --authkey $env:TS_AUTHKEY --unattended

        Start-Sleep 15

        $ip = & $ts ip -4

        Write-Host "================================"
        Write-Host "✅ RDP READY"
        Write-Host "🌐 TAILSCALE IP:"
        Write-Host $ip
        Write-Host "👤 USERNAME: rdp"
        Write-Host "🔑 PASSWORD: P@ssw0rd123!"
        Write-Host "LOGIN AS: .\rdp"
        Write-Host "================================"

    - name: Keep RDP Alive
      shell: pwsh
      run: |
        Write-Host "Keeping RDP alive..."
        Start-Sleep -Seconds 21600
